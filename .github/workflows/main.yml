name: CCF Bot Screener

on:
  schedule:
    # Jalankan SETIAP 1 JAM (Aman dari batas kuota GitHub)
    - cron: '0 * * * *'
  
  # Bisa dijalankan manual kapan saja buat testing
  workflow_dispatch:

jobs:
  run-screener:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run CCF Bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_ID: ${{ secrets.TELEGRAM_ADMIN_ID }}
        run: python main.py

      - name: Commit Subscriber Data (Jika ada perubahan)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add subscribers.json
          git commit -m "Auto-update subscriber data" || echo "No changes to commit"
          git push
